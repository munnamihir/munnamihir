</defs><rect x="0" y="0" width="1200" height="265" rx="24" fill="url(#base)" stroke="#22344D" stroke-width="1"/><text x="45" y="52" font-size="16" font-weight="800" fill="#6DE1EC" text-anchor="start" letter-spacing="2">HOW I BUILD</text><text x="45" y="93" font-size="27" font-weight="700" fill="#F4F7FC" text-anchor="start" letter-spacing="0">A repeatable loop, not a one-off demo.</text><rect x="45" y="120" width="216" height="115" rx="15" fill="#14233A" stroke="#304A66" stroke-width="1"/><text x="62" y="154" font-size="17" font-weight="800" fill="#54DCE7" text-anchor="start" letter-spacing="0">01</text><text x="98" y="154" font-size="14" font-weight="800" fill="#ECF6FC" text-anchor="start" letter-spacing="0.35">UNDERSTAND</text><text x="62" y="188" font-size="12.5" font-weight="450" fill="#A9BDD6" text-anchor="start" letter-spacing="0">Find the real constraint</text><path d="M 261 177 h 16 m -6 -6 l 6 6 -6 6" fill="none" stroke="#72B6CD" stroke-width="1.8"/><rect x="277" y="120" width="216" height="115" rx="15" fill="#14233A" stroke="#304A66" stroke-width="1"/><text x="294" y="154" font-size="17" font-weight="800" fill="#77B4FF" text-anchor="start" letter-spacing="0">02</text><text x="330" y="154" font-size="14" font-weight="800" fill="#ECF6FC" text-anchor="start" letter-spacing="0.35">DESIGN</text><text x="294" y="188" font-size="12.5" font-weight="450" fill="#A9BDD6" text-anchor="start" letter-spacing="0">Make tradeoffs explicit</text><path d="M 493 177 h 16 m -6 -6 l 6 6 -6 6" fill="none" stroke="#72B6CD" stroke-width="1.8"/><rect x="509" y="120" width="216" height="115" rx="15" fill="#14233A" stroke="#304A66" stroke-width="1"/><text x="526" y="154" font-size="17" font-weight="800" fill="#B59DFF" text-anchor="start" letter-spacing="0">03</text><text x="562" y="154" font-size="14" font-weight="800" fill="#ECF6FC" text-anchor="start" letter-spacing="0.35">IMPLEMENT</text><text x="526" y="188" font-size="12.5" font-weight="450" fill="#A9BDD6" text-anchor="start" letter-spacing="0">Ship the smallest slice</text><path d="M 725 177 h 16 m -6 -6 l 6 6 -6 6" fill="none" stroke="#72B6CD" stroke-width="1.8"/><rect x="741" y="120" width="216" height="115" rx="15" fill="#14233A" stroke="#304A66" stroke-width="1"/><text x="758" y="154" font-size="17" font-weight="800" fill="#7AE2AE" text-anchor="start" letter-spacing="0">04</text><text x="794" y="154" font-size="14" font-weight="800" fill="#ECF6FC" text-anchor="start" letter-spacing="0.35">VALIDATE</text><text x="758" y="188" font-size="12.5" font-weight="450" fill="#A9BDD6" text-anchor="start" letter-spacing="0">Test what can go wrong</text><path d="M 957 177 h 16 m -6 -6 l 6 6 -6 6" fill="none" stroke="#72B6CD" stroke-width="1.8"/><rect x="973" y="120" width="216" height="115" rx="15" fill="#14233A" stroke="#304A66" stroke-width="1"/><text x="990" y="154" font-size="17" font-weight="800" fill="#F5C886" text-anchor="start" letter-spacing="0">05</text><text x="1026" y="154" font-size="14" font-weight="800" fill="#ECF6FC" text-anchor="start" letter-spacing="0.35">ITERATE</text><text x="990" y="188" font-size="12.5" font-weight="450" fill="#A9BDD6" text-anchor="start" letter-spacing="0">Improve from evidence</text></svg>
