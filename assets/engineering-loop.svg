  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#40D8F5"/><stop offset="1" stop-color="#8E91FF"/></linearGradient>
  <linearGradient id="pale" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16243C"/><stop offset="1" stop-color="#131D32"/></linearGradient>
