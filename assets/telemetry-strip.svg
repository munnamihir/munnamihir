<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="216" viewBox="0 0 1200 216" role="img" aria-label="Eleven curated public projects, four focus areas, and three delivery modes. Editorial sampling, not all GitHub repositories."><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080F1F"/><stop offset=".55" stop-color="#0C1830"/><stop offset="1" stop-color="#0D1124"/></linearGradient>
<linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#26E6DC"/><stop offset=".55" stop-color="#69CFFF"/><stop offset="1" stop-color="#B48FFF"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7393D4" stroke-opacity=".10"/></pattern>
<filter id="halo"><feGaussianBlur stdDeviation="4"/></filter>
<style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:Consolas,'Liberation Mono',monospace}</style>
</defs><rect width="1200" height="216" rx="20" fill="url(#bg)" stroke="#335071" stroke-width="1"/><rect width="1200" height="216" rx="20" fill="url(#grid)" /><text x="28" y="39" fill="#73E9E5" font-size="14" font-weight="800" class="mono">// REPOSITORY SAMPLE TELEMETRY</text><rect x="26" y="62" width="275" height="127" rx="12" fill="#11223A" stroke="#355273" stroke-width="1"/><text x="43" y="121" fill="#6AE1E7" font-size="44" font-weight="800" class="mono">11</text><text x="130" y="114" fill="#EDF6FF" font-size="13" font-weight="800" class="mono">PUBLIC PROJECTS</text><text x="130" y="141" fill="#91A9C4" font-size="11" font-weight="500" class="mono">curated snapshot</text><rect x="317" y="62" width="275" height="127" rx="12" fill="#11223A" stroke="#355273" stroke-width="1"/><text x="334" y="121" fill="#88B5FF" font-size="44" font-weight="800" class="mono">04</text><text x="421" y="114" fill="#EDF6FF" font-size="13" font-weight="800" class="mono">FOCUS AREAS</text><text x="421" y="141" fill="#91A9C4" font-size="11" font-weight="500" class="mono">editorial groupings</text><rect x="608" y="62" width="275" height="127" rx="12" fill="#11223A" stroke="#355273" stroke-width="1"/><text x="625" y="121" fill="#C1AAFF" font-size="44" font-weight="800" class="mono">03</text><text x="712" y="114" fill="#EDF6FF" font-size="13" font-weight="800" class="mono">DELIVERY MODES</text><text x="712" y="141" fill="#91A9C4" font-size="11" font-weight="500" class="mono">3 ways to ship</text><rect x="899" y="62" width="275" height="127" rx="12" fill="#11223A" stroke="#355273" stroke-width="1"/><text x="916" y="121" fill="#8FE7BD" font-size="44" font-weight="800" class="mono">∞</text><text x="1003" y="114" fill="#EDF6FF" font-size="13" font-weight="800" class="mono">QUESTIONS TO ASK</text><text x="1003" y="141" fill="#91A9C4" font-size="11" font-weight="500" class="mono">before shipping</text></svg>