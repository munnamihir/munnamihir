<svg xmlns="http://www.w3.org/2000/svg" width="600" height="483" viewBox="0 0 600 483" role="img" aria-label="Pie chart of eleven selected repositories by focus: security/privacy four, reliability/safety three, AI/automation two, platform/tools two."><defs>
