66" stroke-width="1"/><rect x="646" y="156" width="40" height="40" rx="11" fill="#B59CFF" fill-opacity=".12" stroke="#B59CFF"/><text x="666" y="183" font-size="14" font-weight="800" fill="#B59CFF" text-anchor="middle" letter-spacing="0">03</text><text x="647" y="225" font-size="17" font-weight="800" fill="#F5F8FC" text-anchor="start" letter-spacing="0.5">DATA &amp; EVENTS</text><text x="647" y="255" font-size="13" font-weight="500" fill="#B6C4D8" text-anchor="start" letter-spacing="0">SQL Server  •  PostgreSQL  •  Kafka</text><line x1="895" y1="211" x2="917" y2="211" stroke="#69B8D6" stroke-width="2"/><path d="M 912 205 l 7 6 -7 6" fill="none" stroke="#69B8D6" stroke-width="2"/><rect x="919" y="137" width="267" height="152" rx="17" fill="#17243A" stroke="#324A66" stroke-width="1"/><rect x="938" y="156" width="40" height="40" rx="11" fill="#8BE9BE" fill-opacity=".12" stroke="#8BE9BE"/><text x="958" y="183" font-size="14" font-weight="800" fill="#8BE9BE" text-anchor="middle" letter-spacing="0">04</text><text x="939" y="225" font-size="17" font-weight="800" fill="#F5F8FC" text-anchor="start" letter-spacing="0.5">ASSURANCE</text><text x="939" y="255" font-size="13" font-weight="500" fill="#B6C4D8" text-anchor="start" letter-spacing="0">Auth  •  Test harnesses  •  Observability</text><text x="43" y="342" font-size="15" font-weight="450" fill="#96ABC4" text-anchor="start" letter-spacing="0">Example patterns from multiple projects — not a claim that every project uses this entire stack.</text></svg>
