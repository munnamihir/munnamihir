<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="555" viewBox="0 0 1200 555" role="img" aria-label="Six project areas including Aplomb, FleetMind, cryptoscan-pqc, QuantumMail, ORYBIT and NemoClaw Community."><defs>
