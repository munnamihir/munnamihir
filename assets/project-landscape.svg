</defs><rect x="0" y="0" width="1200" height="555" rx="24" fill="url(#base)" stroke="#22344D" stroke-width="1"/><text x="43" y="54" font-size="16" font-weight="800" fill="#6DE1EC" text-anchor="start" letter-spacing="2">PROJECT LANDSCAPE</text><text x="43" y="91" font-size="25" font-weight="620" fill="#F4F7FC" text-anchor="start" letter-spacing="0">Different domains. A consistent engineering approach.</text><rect x="43" y="123" width="357" height="183" rx="17" fill="url(#pale)" stroke="#29415E" stroke-width="1"/><rect x="60" y="143" width="5" height="142" rx="2" fill="#5DDEEB"/><text x="83" y="164" font-size="12" font-weight="700" fill="#5DDEEB" text-anchor="start" letter-spacing="1.1">01  /  AUTONOMOUS SAFETY</text><text x="83" y="208" font-size="26" font-weight="750" fill="#F4F7FC" text-anchor="start" letter-spacing="0">Aplomb</text><text x="83" y="243" font-size="15" font-weight="500" fill="#B7C6DA" text-anchor="start" letter-spacing="0">Independent safety conformance</text><line x1="83" y1="261" x2="357" y2="261" stroke="#30435B" stroke-width="1"/><text x="83" y="283" font-size="13" font-weight="500" fill="#92A9C3" text-anchor="start" letter-spacing="0">7,180 reference test vectors</text><rect x="422" y="123" width="357" height="183" rx="17" fill="url(#pale)" stroke="#29415E" stroke-width="1"/><rect x="439" y="143" width="5" height="142" rx="2" fill="#74ACFE"/><text x="462" y="164" font-size="12" font-weight="700" fill="#74ACFE" text-anchor="start" letter-spacing="1.1">02  /  FLEET INTELLIGENCE</text><text x="462" y="208" font-size="26" font-weight="750" fill="#F4F7FC" text-anchor="start" letter-spacing="0">FleetMind</text><text x="462" y="243" font-size="15" font-weight="500" fill="#B7C6DA" text-anchor="start" letter-spacing="0">Telemetry / diagnostics / action</text><line x1="462" y1="261" x2="736" y2="261" stroke="#30435B" stroke-width="1"/><text x="462" y="283" font-size="13" font-weight="500" fill="#92A9C3" text-anchor="start" letter-spacing="0">Human-controlled decisions</text><rect x="801" y="123" width="357" height="183" rx="17" fill="url(#pale)" stroke="#29415E" stroke-width="1"/><rect x="818" y="143" width="5" height="142" rx="2" fill="#B7A0FF"/><text x="841" y="164" font-size="12" font-weight="700" fill="#B7A0FF" text-anchor="start" letter-spacing="1.1">03  /  CRYPTOGRAPHY</text><text x="841" y="208" font-size="26" font-weight="750" fill="#F4F7FC" text-anchor="start" letter-spacing="0">cryptoscan-pqc</text><text x="841" y="243" font-size="15" font-weight="500" fill="#B7C6DA" text-anchor="start" letter-spacing="0">Cryptographic inventory</text><line x1="841" y1="261" x2="1115" y2="261" stroke="#30435B" stroke-width="1"/><text x="841" y="283" font-size="13" font-weight="500" fill="#92A9C3" text-anchor="start" letter-spacing="0">CycloneDX 1.6 CBOM</text><rect x="43" y="329" width="357" height="183" rx="17" fill="url(#pale)" stroke="#29415E" stroke-width="1"/><rect x="60" y="349" width="5" height="142" rx="2" fill="#83E8B1"/><text x="83" y="370" font-size="12" font-weight="700" fill="#83E8B1" text-anchor="start" letter-spacing="1.1">04  /  SECURE COMMUNICATION</text><text x="83" y="414" font-size="26" font-weight="750" fill="#F4F7FC" text-anchor="start" letter-spacing="0">QuantumMail</text><text x="83" y="449" font-size="15" font-weight="500" fill="#B7C6DA" text-anchor="start" letter-spacing="0">Client-side email encryption</text><line x1="83" y1="467" x2="357" y2="467" stroke="#30435B" stroke-width="1"/><text x="83" y="489" font-size="13" font-weight="500" fill="#92A9C3" text-anchor="start" letter-spacing="0">Per-recipient key wrapping</text><rect x="422" y="329" width="357" height="183" rx="17" fill="url(#pale)" stroke="#29415E" stroke-width="1"/><rect x="439" y="349" width="5" height="142" rx="2" fill="#F8CC89"/><text x="462" y="370" font-size="12" font-weight="700" fill="#F8CC89" text-anchor="start" letter-spacing="1.1">05  /  PHYSICAL COMPUTING</text><text x="462" y="414" font-size="26" font-weight="750" fill="#F4F7FC" text-anchor="start" letter-spacing="0">ORYBIT</text><text x="462" y="449" font-size="15" font-weight="500" fill="#B7C6DA" text-anchor="start" letter-spacing="0">Software identity for objects</text><line x1="462" y1="467" x2="736" y2="467" stroke="#30435B" stroke-width="1"/><text x="462" y="489" font-size="13" font-weight="500" fill="#92A9C3" text-anchor="start" letter-spacing="0">Identity • memory • permissions</text><rect x="801" y="329" width="357" height="183" rx="17" fill="url(#pale)" stroke="#29415E" stroke-width="1"/><rect x="818" y="349" width="5" height="142" rx="2" fill="#F2A3BA"/><text x="841" y="370" font-size="12" font-weight="700" fill="#F2A3BA" text-anchor="start" letter-spacing="1.1">06  /  AI AGENTS</text><text x="841" y="414" font-size="26" font-weight="750" fill="#F4F7FC" text-anchor="start" letter-spacing="0">NemoClaw Community</text><text x="841" y="449" font-size="15" font-weight="500" fill="#B7C6DA" text-anchor="start" letter-spacing="0">Inspectable agent workflows</text><line x1="841" y1="467" x2="1115" y2="467" stroke="#30435B" stroke-width="1"/><text x="841" y="489" font-size="13" font-weight="500" fill="#92A9C3" text-anchor="start" letter-spacing="0">Constrained runtime patterns</text></svg>