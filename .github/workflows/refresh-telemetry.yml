name: Refresh profile telemetry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-telemetry.yml'
      - 'scripts/refresh_telemetry.py'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: write

jobs:
  generate-language-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public repository languages and generate SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh_telemetry.py
      - name: Commit updated chart when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/language-donut.svg assets/language-telemetry.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public language telemetry'
            git push
          fi

